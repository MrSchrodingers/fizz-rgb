name: ✨ Feature request
description: Suggest an idea for fizz-rgb.
title: '[feat] '
labels: [enhancement, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a feature! 💡 Please describe the problem you are trying to solve, not just the solution.

        Pode escrever em português.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do? What is the friction today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work? Sketch the CLI / GUI / API changes.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why they did not fit.
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      multiple: true
      options:
        - daemon (fizzd)
        - CLI (fizz)
        - GUI (fizz-gui)
        - core (@fizz/core)
        - docs
        - tooling / build
        - other
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to submit a PR for this feature.
