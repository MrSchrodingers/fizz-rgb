<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="rgb" x1="0" x2="1" y1=".5" y2=".5">
      <stop offset="0%"   stop-color="#ff2d55"/>
      <stop offset="18%"  stop-color="#ff9500"/>
      <stop offset="36%"  stop-color="#ffd60a"/>
      <stop offset="54%"  stop-color="#34c759"/>
      <stop offset="72%"  stop-color="#0a84ff"/>
      <stop offset="90%"  stop-color="#bf5af2"/>
      <stop offset="100%" stop-color="#ff2d55"/>
    </linearGradient>

    <linearGradient id="capBody" x1=".5" x2=".5" y1="0" y2="1">
      <stop offset="0%"   stop-color="#3c3c4a"/>
      <stop offset="100%" stop-color="#1a1a24"/>
    </linearGradient>

    <linearGradient id="topFace" x1=".5" x2=".5" y1="0" y2="1">
      <stop offset="0%"   stop-color="#2b2b38"/>
      <stop offset="100%" stop-color="#16161e"/>
    </linearGradient>

    <linearGradient id="shine" x1=".5" x2=".5" y1="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="bg" cx=".5" cy="1" r=".9">
      <stop offset="0%"   stop-color="#191925"/>
      <stop offset="100%" stop-color="#08080c"/>
    </radialGradient>

    <linearGradient id="letterGlow" x1=".5" x2=".5" y1="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bdbdcc"/>
    </linearGradient>

    <filter id="halo" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity=".55"/>
    </filter>
  </defs>

  <!-- App background tile -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- RGB halo (large blurred bar behind cap, extending down) -->
  <g filter="url(#halo)" opacity=".9">
    <rect x="72" y="320" width="368" height="80" rx="40" fill="url(#rgb)"/>
  </g>

  <!-- Hard RGB strip just under the keycap -->
  <rect x="120" y="346" width="272" height="14" rx="7" fill="url(#rgb)"/>

  <!-- Drop shadow under the keycap -->
  <ellipse cx="256" cy="344" rx="138" ry="14" fill="#000" opacity=".55"/>

  <!-- Keycap body -->
  <rect x="112" y="124" width="288" height="220" rx="44"
        fill="url(#capBody)" stroke="#4c4c60" stroke-width="2"
        filter="url(#softShadow)"/>

  <!-- Inset top face -->
  <rect x="142" y="150" width="228" height="166" rx="30"
        fill="url(#topFace)" stroke="#3a3a48" stroke-width="1.2"/>

  <!-- Top shine highlight -->
  <rect x="148" y="156" width="216" height="80" rx="26" fill="url(#shine)"/>

  <!-- "F" mark -->
  <text x="256" y="264" font-family="Inter, Arial Black, sans-serif"
        font-weight="900" font-size="124" letter-spacing="-6"
        text-anchor="middle" fill="url(#letterGlow)">F</text>
</svg>
